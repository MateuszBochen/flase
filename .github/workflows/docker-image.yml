# Production image to Docker Hub after new tag (v1.2.3 -> 1.2.3, 1.2, 1, latest; v1.3.0-rc.1 does not move latest).
#
# Setup in GitHub repository -> Settings -> Secrets and variables -> Actions:
#   variable DOCKERHUB_USERNAME - Docker Hub account (or organization)
#   secret   DOCKERHUB_TOKEN    - Docker Hub -> Account settings -> Personal access tokens (Read & Write)
#   variable DOCKERHUB_IMAGE    - optional, default <DOCKERHUB_USERNAME>/flase
#
# Release: git tag v1.0.0 && git push origin v1.0.0
name: Docker image

on:
  push:
    tags: ['v*']
  # manual run (Actions -> Docker image -> Run workflow) builds and tests image without publishing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/flase', vars.DOCKERHUB_USERNAME) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Tags of image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          load: true
          tags: flase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name flase -p 3001:3001 -e FLASE_CONNECTIONS='["mysql://db:3306"]' flase:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:3001/api/config > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3001/api/config | grep -q '"allowCustomConnections":true'
          curl -sf http://localhost:3001/api/config | grep -q 'mysql://db:3306'
          curl -sf http://localhost:3001/ | grep -q '<div id="root">'
          curl -sf http://localhost:3001/tables/deep/link | grep -q '<div id="root">'
          docker logs flase

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          # linux/arm64 can be added (emulated build takes several times longer)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
